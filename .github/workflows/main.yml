name: Scrape Field Statuses

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # Use an existing Node release

      - name: Install dependencies
        run: npm ci

      - name: Run scraper script
        run: node scraper.js

      - name: Configure git for commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push field_statuses.json if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure we're on the checked-out branch and have up-to-date refs
          git fetch origin +refs/heads/main:refs/remotes/origin/main || true
          # Ensure we have up-to-date refs from origin
          git fetch origin main || true

          # Stage the file; if it doesn't exist or nothing changed, the script will skip push
          git add field_statuses.json || true

          # If there's nothing staged, exit without committing/pushing
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Automate: Update field_statuses.json" || true

          # Push back to main (GITHUB_TOKEN provided by Actions has write access in this repo)
          git push origin HEAD:main
